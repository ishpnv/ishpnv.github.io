document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent, oklch(0.58 0.17 250))\">рейс avs 03 · в полёте<\u002Fdiv>\n          <h3 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.02em\">Яндекс<\u002Fh3>\n          <div style=\"font-size: 15px; color: rgba(16,36,58,0.68)\">Разработчик интерфейсов · декабрь 2024 — настоящее время · 1 год 8 месяцев · Москва<\u002Fdiv>\n        <\u002Fdiv>\n        \n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 9px; border-top: 1px solid #e6eef7; padding-top: 20px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(16,36,58,0.64)\">куда летели · о проекте<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.7; color: rgba(16,36,58,0.85); text-wrap: pretty; max-width: 78ch\">Основной проект: frontend-часть супераппа Фантеха, функционал онлайн-кинотеатра. Развитие пользовательских сценариев кинотеатра, подписки и монетизации, авторизации, платежей, аналитики и маркетинговых интеграций. SSR-приложение на React с desktop и mobile/touch версиями.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px 32px\">\n        <div style=\"display: flex; flex-direction: column; gap: 11px\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(16,36,58,0.64)\">что делал в кабине · задачи<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; line-height: 1.6; color: rgba(16,36,58,0.85)\">\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Компоненты и пользовательские сценарии на React + TypeScript<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Разработка и поддержка SSR-приложения на React 18 и Vite поверх внутреннего фреймворка компании<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Сценарии монетизации: paywall, loginwall, платёжный виджет, модальные окна оплаты, карточки тарифов и офферов<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Тарифная логика: месячная и годовая подписка, локализация цен с учётом валют и правил округления по странам<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Работа с GraphQL API и загрузкой данных через Suspense-ресурсы<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Управление состоянием через DI-менеджеры, кастомные сторы и сигналы<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Параллельная поддержка desktop и mobile/touch версий со скоординированными релизами<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Мультиязычность и локализация через react-intl, поддержка RTL и арабской локали<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Интеграция и развитие сквозной аналитики: Яндекс.Метрика, GTM (клиентский и серверный), GA4, AppsFlyer, партнёрские пиксели<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Выкатка продуктовых изменений через A/B-эксперименты, feature flags и remote config<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Маркетинговые и партнёрские лендинги, схемы выдачи и активации промокодов<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Рефакторинг и унификация frontend-кода и аналитики между платформами<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Миграция сервиса с Next.js на внутреннюю SSR-архитектуру: изоляция layout, контейнеры страниц, разделение данных и презентации<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Настройка Content Security Policy и nonce для инлайн-скриптов и трекеров<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>SEO-задачи: URL-схема, редиректы, robots.txt<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Кросс-командное code review<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Разработка с AI-агентами в большой кодовой базе: проектные соглашения AGENTS.md, агентное ревью и рефакторинг, генерация и поддержка тестов<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Подключение MCP-серверов к рабочим инструментам (трекер, код-ревью, документация), чтобы агент работал с реальным контекстом задачи<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Мультиагентные сценарии: агент-исследователь по кодовой базе и агент-исполнитель при разборе больших легаси-модулей и сквозных миграциях<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Приведение промптов и контекста к воспроизводимому виду: правила проекта, чек-листы перед коммитом, шаблоны задач для команды<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 11px\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(16,36,58,0.64)\">прилетели с результатом · достижения<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; line-height: 1.6; color: rgba(16,36,58,0.85)\">\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: oklch(0.55 0.13 150)\">↗<\u002Fspan><span>В качестве feature lead реализовал партнёрский лендинг, который привёл <strong style=\"font-weight: 700; color: #10243a\">3 263 подписчика<\u002Fstrong> и обеспечил <strong style=\"font-weight: 700; color: #10243a\">22% всех подписок в стране<\u002Fstrong> реализации за период — без затрат на performance-маркетинг<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: oklch(0.55 0.13 150)\">↗<\u002Fspan><span>Участвовал в реализации партнёрского лендинга, позволившего снизить <strong style=\"font-weight: 700; color: #10243a\">CPA с 58 до 39 долларов<\u002Fstrong> и привлечь 1 304 подписчика<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: oklch(0.55 0.13 150)\">↗<\u002Fspan><span>Реализовал инфраструктуру маркетинговой кампании, которая принесла <strong style=\"font-weight: 700; color: #10243a\">2 639 активаций промокодов<\u002Fstrong><\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: oklch(0.55 0.13 150)\">↗<\u002Fspan><span>Провёл рефакторинг и унификацию аналитики между desktop и mobile/touch: свёл разрозненную инициализацию метрики в единую точку входа, устранил дублирование событий на обеих платформах, вычистил неиспользуемые трекинги и счётчики<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: oklch(0.55 0.13 150)\">↗<\u002Fspan><span>Перенёс конфигурацию офферов, бейджей и аналитических событий в админку — их можно менять без релизов<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: oklch(0.55 0.13 150)\">↗<\u002Fspan><span>Вынес платёжные компоненты и core-хуки i18n в общие переиспользуемые пакеты, сократив дублирование между desktop и mobile/touch версиями<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: oklch(0.55 0.13 150)\">↗<\u002Fspan><span>Перепроектировал управление состоянием одного из пейволов, устранив рассинхрон выбранного оффера и параметров в URL<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: oklch(0.55 0.13 150)\">↗<\u002Fspan><span>Выполнил SEO-переезд URL-схемы<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px\"><span style=\"color: oklch(0.55 0.13 150)\">↗<\u002Fspan><span>Участвовал в переводе серверных запросов на GraphQL Router и в чистке CSP под требования региона<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 11px; border-top: 1px solid #e6eef7; padding-top: 20px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(16,36,58,0.64)\">стек на борту<\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">React 18<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">TypeScript<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">JavaScript<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">SSR<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">Vite<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">Next.js<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">Express<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">GraphQL<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">Suspense<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; f   <h3 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.02em\">DL Studio<\u002Fh3>\n          <div style=\"font-size: 15px; color: rgba(16,36,58,0.68)\">Frontend-разработчик · май — октябрь 2022 · 6 месяцев · Москва<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 9px; border-top: 1px solid #e6eef7; padding-top: 20px\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(16,36,58,0.64)\">куда летели · о проектах<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.7; color: rgba(16,36,58,0.85); text-wrap: pretty\">Веб-студия полного цикла: промо-лендинги для крупных брендов, корпоративные сайты, интернет-магазины и личные кабинеты. Работа в потоке коротких проектов с жёсткими дедлайнами, привязанными к датам рекламных кампаний, по несколько проектов одновременно.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px 30px\">\n          <div style=\"display: flex; flex-direction: column; gap: 11px\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(16,36,58,0.64)\">задачи<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; line-height: 1.6; color: rgba(16,36,58,0.85)\">\n              <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Вёрстка и разработка страниц по макетам из Figma: адаптив, кроссбраузерность, pixel perfect<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Интерфейсная логика на JavaScript и React: формы, слайдеры, модальные окна, интерактивные промо-механики<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Интеграция вёрстки с CMS и передача проектов бэкенд-разработчикам<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Подключение веб-аналитики и целей на формы, настройка событий по ТЗ<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Оптимизация загрузки промо-страниц: изображения, шрифты, анимации<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Правки по итогам ревью дизайнера и клиентских согласований, поддержка выпущенных проектов<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; gap: 10px\"><span style=\"color: var(--accent, oklch(0.58 0.17 250))\">—<\u002Fspan><span>Работа с Git в командном флоу, задачи в трекере<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 11px\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(16,36,58,0.64)\">чему научился<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; line-height: 1.6; color: rgba(16,36,58,0.85)\">\n              <div style=\"display: flex; gap: 10px\"><span style=\"color: oklch(0.55 0.13 150)\">↗<\u002Fspan><span>Доводить проект до прода в срок, когда дата запуска кампании не двигается<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; gap: 10px\"><span style=\"color: oklch(0.55 0.13 150)\">↗<\u002Fspan><span>Быстро переключаться между проектами и чужим кодом, разбираться в чужой вёрстке без документации<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; gap: 10px\"><span style=\"color: oklch(0.55 0.13 150)\">↗<\u002Fspan><span>Верстать так, чтобы это переживало правки клиента: думать о структуре, а не только о картинке<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; gap: 10px\"><span style=\"color: oklch(0.55 0.13 150)\">↗<\u002Fspan><span>Разговаривать с дизайнером и менеджером на языке ограничений вёрстки, а не отказов<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid #e6eef7; padding-top: 20px\">\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">JavaScript<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">React<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">HTML<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">CSS<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">SASS<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">адаптивная вёрстка<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 7px 11px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">Git<\u002Fspan>\n        <\u00 monospace; font-size: 11px; color: rgba(16,36,58,0.62)\">всегда со мной<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n          <span style=\"background: var(--accent, oklch(0.58 0.17 250)); color: #ffffff; border-radius: 7px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px\">React<\u002Fspan>\n          <span style=\"background: var(--accent, oklch(0.58 0.17 250)); color: #ffffff; border-radius: 7px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px\">TypeScript<\u002Fspan>\n          <span style=\"background: var(--accent, oklch(0.58 0.17 250)); color: #ffffff; border-radius: 7px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px\">JavaScript<\u002Fspan>\n          <span style=\"background: var(--accent, oklch(0.58 0.17 250)); color: #ffffff; border-radius: 7px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px\">SSR · Vite<\u002Fspan>\n          <span style=\"background: var(--accent, oklch(0.58 0.17 250)); color: #ffffff; border-radius: 7px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px\">Redux · Redux Toolkit<\u002Fspan>\n          <span style=\"background: var(--accent, oklch(0.58 0.17 250)); color: #ffffff; border-radius: 7px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px\">Метрика · GTM · GA4<\u002Fspan>\n          <span style=\"background: var(--accent, oklch(0.58 0.17 250)); color: #ffffff; border-radius: 7px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px\">CSS Modules · RTL<\u002Fspan>\n          <span style=\"background: var(--accent, oklch(0.58 0.17 250)); color: #ffffff; border-radius: 7px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px\">Git · code review<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #ffffff; border: 1px solid #dbe6f2; border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; gap: 16px\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.55 0.13 150)\">сдаю в багаж<\u002Fdiv>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(16,36,58,0.62)\">достану по запросу<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">Node.js · Express<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">PostgreSQL<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">GraphQL · REST<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">Vitest · Testplane · Jest<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">CSP и безопасность фронта<\u002Fspan>\n          <span style=\"background: #eaf2fc; color: #1d4368; border-radius: 7px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">MCP · агентные workflow<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #ffffff; border: 1px solid #dbe6f2; border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; gap: 16px\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(16,36,58,0.68)\">запрещено к перевозке<\u002Fdiv>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(16,36,58,0.62)\">0 кг<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14.5px; line-height: 1.55; color: rgba(16,36,58,0.78)\">\n          <div style=\"display: flex; gap: 10px\"><span style=\"font-family: 'JetBrains Mono', monospace\">✕<\u002Fspan><span>Задачи без метрики успеха: «сделайте красиво» без ответа, что изменится в цифрах<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px\"><span style=\"font-family: 'JetBrains Mono', monospace\">✕<\u002Fspan><span>Релизы без возможности выкатить под флагом и откатить<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px\"><span style=\"font-family: 'JetBrains Mono', monospace\">✕<\u002Fspan><span>Аналитика, прикрученная в последний день перед запуском<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px\"><span style=\"font-family: 'JetBrains Mono', monospace\">✕<\u002Fspan><span>Микроменеджмент вместо код-ревью<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ showCaptions }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6; color: rgba(16,36,58,0.62)\">\n        <span style=\"color: var(--accent, oklch(0.58 0.17 250))\">//<\u002Fspan>\n        <span>перевес не доплачиваю — новый фреймворк выучу по дороге<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div data-m=\"rail\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start\">\n    <div data-m=\"card\" style=\"background: #ffffff; border: 1px solid #dbe6f2; border-radius: 20px; padding: 30px 32px; display: flex; flex-direction: column; gap: 22px\">\n      <div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(16,36,58,0.62)\">о себе<\u002Fspan>\n        <h2 data-m=\"h2\" style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -0.02em\">Информация о пассажире<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 16px; font-size: 15.5px; line-height: 1.7; color: rgba(16,36,58,0.87); text-wrap: pretty; max-width: 74ch\">\n        <div style=\"font-size: 18px; font-weight: 600; line-height: 1.5; color: #10243a\">Frontend-разработчик, 4+ лет коммерческого опыта. React и TypeScript.<\u002Fdiv>\n        <div>Начинал в веб-студии: промо-лендинги и сайты для крупных брендов, по несколько проектов одновременно и дедлайны, привязанные к датам рекламных кампаний. Дальше перешёл в продуктовую разработку b2b-систем: центр управления перевозками для логистов, интерфейсы для call-центра, административные панели. Там были сложные формы, WebSocket как основной протокол обмена данными, legacy-код, Redux Toolkit, тесты и миграция сборки с Webpack на Vite.<\u002Fdiv>\n        <div>Последние два года работаю над международным b2c-продуктом на рынке MENA: SSR-приложение на React с desktop и mobile/touch версиями, мультиязычность и RTL. Отвечаю за монетизацию (paywall, подписки, тарифы, платежи) и сквозную веб-аналитику (Яндекс.Метрика, GTM, GA4, AppsFlyer), выкатываю изменения через A/B-эксперименты и feature flags.<\u002Fdiv>\n        <div>В сумме прошёл путь от вёрстки по макету до фич, у которых есть измеримый результат в деньгах. Есть опыт бэкенда (в пет-проектах + самообучение) на Node.js, Express и PostgreSQL, достаточный, чтобы договариваться с бэкенд-командой о контрактах API. Параллельно веду проекты на подряде и держу собственную инфраструктуру.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-m=\"meme\" style=\"align-self: start\">\n      <image-slot id=\"meme-about\" style=\"width: 100%; height: auto; aspect-ratio: 600 / 450\" shape=\"rounded\" radius=\"16\" src=\"17523b95-97e5-4638-ad28-4b079e011183\" placeholder=\"мем, который описывает тебя точнее резюме\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-direction: column; gap: 20px\">\n    <div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent, oklch(0.58 0.17 250))\">образование и формальности<\u002Fspan>\n      <h2 data-m=\"h2\" style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.02em\">Документы пассажира<\u002Fh2>\n    <\u002Fdiv>\n    <div data-m=\"rail\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px\">\n        <div style=\"background: #ffffff; border: 1px solid #dbe6f2; border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(16,36,58,0.64)\">образование · высшее<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600; line-height: 1.4\">Институт международных экономических связей, Москва<\u002Fdiv>\n          <div style=\"font-size: 14.5px; line-height: 1.6; color: rgba(16,36,58,0.75)\">Экономика, международная экономика · 2017<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; border: 1px solid #dbe6f2; border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(16,36,58,0.64)\">языки<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.5\">\n            <div style=\"display: flex; justify-content: space-between; gap: 12px\"><span>Русский<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: rgba(16,36,58,0.7)\">родной<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; gap: 12px\"><span>Английский<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: rgba(16,36,58,0.7)\">C1 · продвинутый<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; border: 1px solid #dbe6f2; border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(16,36,58,0.64)\">условия перелёта<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 7px; font-size: 14.5px; line-height: 1.55; color: rgba(16,36,58,0.82)\">\n            <div>30 лет · Москва · гражданство РФ<\u002Fdiv>\n            <div>Полная занятость, на месте работодателя<\u002Fdiv>\n            <div>Готов к переезду и командировкам<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-m=\"meme\" style=\"align-self: start\">\n        <image-slot id=\"meme-diploma\" style=\"width: 100%; height: auto; aspect-ratio: 1080 / 1069\" shape=\"rounded\" radius=\"16\" src=\"91aa9de0-9f49-46cf-b189-6cf1d92994fb\" placeholder=\"мем про диплом\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-direction: column; gap: 20px\">\n    <div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent, oklch(0.58 0.17 250))\">почему именно вы<\u002Fspan>\n      <h2 data-m=\"h2\" style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.02em\">Билет в одну сторону<\u002Fh2>\n    <\u002Fdiv>\n    <div data-m=\"rail\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start\">\n      <div data-m=\"card\" style=\"background: #0f2942; border-radius: 20px; padding: 30px 32px; display: flex; flex-direction: column; gap: 22px; color: #ffffff\">\n        <div style=\"font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 25px; line-height: 1.3; letter-spacing: -0.02em; text-wrap: pretty\">Вход, профиль и уведомления это не техническая часть сервиса, а первое, по чему о нём судят.<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.7; color: rgba(255,255,255,0.85); text-wrap: pretty\">\n          <div>Aviasales единственные в индустрии разговаривают с пользователем как человек с человеком, а не как «сервис» с «уважаемым клиентом». И самое интересное, что зона ответственности User Platform это ровно те места, где почти любой продукт срывается обратно в канцелярит: письмо о подтверждении входа, пуш, экран ошибки, страница профиля. Там обычно живут «ваша заявка обрабатывается» и «произошла непредвиденная ошибка». Мне нравится идея делать эти скучные экраны такими же живыми, как всё остальное у вас.<\u002Fdiv>\n          <div>Мой профессиональный путь выглядит так: пять лет учился на экономиста, потом решил, что интерфейсы интереснее, и с 2022 года пишу фронтенд. Специализируюсь на экранах, где человек расстаётся с деньгами или оставляет свой номер, то есть на самых нелюбимых экранах в любом продукте. Научился делать их так, чтобы люди доходили до конца, и умею доказать это цифрами. Готов к тестовому и к тому, чтобы шутки в письмах про OTP проходили через меня.<\u002Fdiv>\n        <\u002Fdiv>\n        \n      <\u002Fdiv>\n      <div data-m=\"meme\" style=\"align-self: start\">\n        <image-slot id=\"meme-why\" style=\"width: 100%; height: auto; aspect-ratio: 1170 / 1273\" shape=\"rounded\" radius=\"16\" src=\"5fae5745-895c-47a9-b640-85af99527209\" placeholder=\"мем «я и мой отпуск»\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ showCaptions }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6; color: rgba(16,36,58,0.62)\">\n        <span style=\"color: var(--accent, oklch(0.58 0.17 250))\">//<\u002Fspan>\n        <span>обратный билет не бронировал — рассчитываю задержаться<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-direction: column; gap: 18px\">\n    <div data-m=\"contacts\" style=\"background: #ffffff; border: 1px solid #dbe6f2; border-radius: 20px; padding: 30px 32px; display: grid; grid-template-columns: minmax(0, 1fr) auto 210px; gap: 28px; align-items: end\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px; min-width: 0\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(16,36,58,0.62)\">посадка заканчивается<\u002Fdiv>\n        <div style=\"font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 38px; line-height: 1.05; letter-spacing: -0.025em; text-transform: uppercase\">Выход на связь<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.6; color: rgba(16,36,58,0.68)\">Отвечаю быстрее, чем приходит письмо о задержке рейса.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px\">\n        <a href=\"https://t.me/ishpnv\" style=\"color: #10243a\">telegram → @ishpnv · предпочтительно<\u002Fa>\n        <a href=\"tel:+79670999022\" style=\"color: #10243a\">телефон → +7 967 099-90-22<\u002Fa>\n        <a href=\"mailto:job.shipunov.igor@yandex.ru\" style=\"color: #10243a\">почта → job.shipunov.igor@yandex.ru<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"min-width: 0\">\n        <image-slot id=\"meme-final\" style=\"width: 100%; height: auto; aspect-ratio: 420 / 236\" shape=\"rounded\" radius=\"16\" src=\"33dc98cd-ed1c-4c8a-86c5-95ac96e3945f\" placeholder=\"прощальный мем\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(16,36,58,0.55)\">\n      <span>игорь шипунов · резюме 2026 · собрано вручную<\u002Fspan>\n      <span>спасибо, что дочитал до конца — теперь давай созвонимся<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showCaptions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Юмор&quot;},&quot;showStickers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Юмор&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;oklch(0.58 0.17 250)&quot;,&quot;options&quot;:[&quot;oklch(0.58 0.17 250)&quot;,&quot;oklch(0.6 0.14 225)&quot;,&quot;oklch(0.55 0.18 275)&quot;,&quot;oklch(0.55 0.13 150)&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Стиль&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const accent = this.props.accent || 'oklch(0.58 0.17 250)';\n    return {\n      showCaptions: this.props.showCaptions ?? true,\n      showStickers: this.props.showStickers ?? true,\n      accentStyle: React.createElement('style', null, ':root{--accent:' + accent + '}')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
